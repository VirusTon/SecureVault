Entername: Build Android APKon:push:branches: [ main, master ]workflow_dispatch:jobs:build:runs-on: ubuntu-lateststeps:
- name: Checkout Repository
  uses: actions/checkout@v4

- name: Set up Python
  uses: actions/setup-python@v5
  with:
    python-version: '3.11'

- name: Install System Dependencies
  run: |
    sudo apt-get update
    sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev zip unzip zlib1g-dev openjdk-17-jdk

- name: Install Buildozer & Dependencies
  run: |
    pip install --upgrade pip setuptools
    pip install buildozer cython

- name: Build APK with Buildozer
  run: |
    yes | buildozer -v android debug

- name: Upload APK Artifact
  uses: actions/upload-artifact@v4
  with:
    name: SecureVault-APK
    path: bin/*.apk
