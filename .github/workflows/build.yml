name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build SecureVault APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            gettext \
            autopoint \
            build-essential \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6

      - name: Check Autotools
        run: |
          autoconf --version
          automake --version
          libtool --version
          libtoolize --version

      - name: Upgrade Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==0.29.34"

      - name: Install Buildozer
        run: |
          python -m pip install git+https://github.com/kivy/buildozer.git

      - name: Prepare Buildozer
        run: |
          buildozer --version

      - name: Build debug APK
        env:
          P4A_RELEASE_KEYSTORE: ""
        run: |
          yes | buildozer -v android debug

      - name: Show generated APK
        if: always()
        run: |
          echo "===== APK files ====="
          find bin -maxdepth 1 -type f -name "*.apk" -print 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureVault-APK
          path: bin/*.apk
          if-no-files-found: error
