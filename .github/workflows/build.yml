name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build SecureVault APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            gettext \
            autopoint \
            build-essential \
            cmake \
            m4 \
            texinfo \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            libbz2-dev \
            libreadline-dev \
            libsqlite3-dev \
            tk-dev \
            liblzma-dev \
            uuid-dev

      - name: Update Autotools to latest
        run: |
          sudo apt-get install -y --only-upgrade autoconf automake libtool
          sudo libtoolize --force --copy --install 2>/dev/null || true

      - name: Verify Autotools Installation
        run: |
          echo "=== Versions ==="
          autoconf --version | head -1
          automake --version | head -1
          libtool --version | head -1
          echo ""
          echo "=== M4 Macros Available ==="
          ls -la /usr/share/aclocal/lt*.m4 | wc -l

      - name: Upgrade Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==0.29.34" "wheel"

      - name: Install Buildozer and python-for-android
        run: |
          python -m pip install git+https://github.com/kivy/buildozer.git
          python -m pip install "python-for-android>=2023.0.0"

      - name: Prepare Buildozer
        run: |
          buildozer --version
          if [ -d ".buildozer/android/platform/python-for-android" ]; then
            buildozer android clean
          else
            echo "First build - skipping clean step"
          fi

      - name: Build debug APK
        env:
          P4A_RELEASE_KEYSTORE: ""
          P4A_DEBUG: "1"
        run: |
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Find generated APK
        if: always()
        run: |
          echo "========================================"
          echo "SEARCHING FOR APK FILES"
          echo "========================================"

          echo ""
          echo "=== bin/ ==="
          ls -lah bin 2>/dev/null || echo "bin directory does not exist"

          echo ""
          echo "=== All APK files in workspace ==="
          find . -type f -name "*.apk" -print 2>/dev/null || true

          echo ""
          echo "=== All AAB files in workspace ==="
          find . -type f -name "*.aab" -print 2>/dev/null || true

          echo ""
          echo "=== Last 50 lines of build log ==="
          tail -50 build.log 2>/dev/null || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SecureVault-APK
          path: |
            bin/*.apk
            **/*.apk
          if-no-files-found: warn

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: build.log
          if-no-files-found: ignore
